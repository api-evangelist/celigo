- aid: celigo:celigo-webhook-listeners
  name: Celigo integrator.io Webhook Listeners
  tags:
  - Webhooks
  - Events
  - AsyncAPI
  - Real-Time
  - Integration
  humanURL: >-
    https://docs.celigo.com/hc/en-us/sections/360009906491-Trigger-real-time-flows-with-webhook-events
  properties:
