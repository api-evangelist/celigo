      https://raw.githubusercontent.com/api-evangelist/celigo/refs/heads/main/asyncapi/celigo-webhook-listeners-asyncapi.yml
    type: AsyncAPI
  description: >-
    Inbound webhook listeners exposed by integrator.io. Each listener provides an auto-generated public
    HTTPS URL that accepts HTTP POST or PUT requests from a source application to trigger a real-time
    flow, with configurable Basic, Token, or HMAC verification, and provider templates for Shopify, HubSpot,
    and Slack alongside a generic webhook type. Successful deliveries return HTTP 204 by default.
