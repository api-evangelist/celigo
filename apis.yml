      https://docs.celigo.com/hc/en-us/articles/360042281231-Getting-started-with-standard-REST-API
    type: GettingStarted
  - url: >-
      https://docs.celigo.com/hc/en-us/articles/360038520652-Set-up-a-connection-to-Celigo-integrator-io
    type: Connection
  description: >-
    The integrator.io Platform API is a RESTful JSON API secured by Bearer Tokens. It provides programmatic
    access to integrations, connections, flows, imports, exports, iClients, and other integrator.io resources,
    with rate limiting via a leaky bucket algorithm of 1000 tokens and a fill rate of 300 tokens per second.
